<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#f8b4c4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Clawed up Glam - Book your nail salon appointment online">
    <title>Clawed up Glam - Book Your Appointment</title>
    
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Space Background with Twinkling Stars -->
    <div class="stars-container" id="starsContainer"></div>
    <div class="interactive-bg">
        <!-- Floating Nail Polish Bottles -->
        <div class="nail-polish bottle-1">💅</div>
        <div class="nail-polish bottle-2">💅</div>
        <div class="nail-polish bottle-3">💅</div>
        <div class="nail-polish bottle-4">💅</div>
        <div class="nail-polish bottle-5">💅</div>
        <div class="nail-polish bottle-6">💅</div>
        <!-- Sparkles -->
        <div class="sparkle sparkle-1">✨</div>
        <div class="sparkle sparkle-2">✨</div>
        <div class="sparkle sparkle-3">✨</div>
        <div class="sparkle sparkle-4">✨</div>
        <div class="sparkle sparkle-5">✨</div>
        <div class="sparkle sparkle-6">✨</div>
        <div class="sparkle sparkle-7">✨</div>
        <div class="sparkle sparkle-8">✨</div>
        <!-- Nail Art Elements -->
        <div class="nail-art art-1">🌸</div>
        <div class="nail-art art-2">🌺</div>
        <div class="nail-art art-3">🌼</div>
        <div class="nail-art art-4">🌷</div>
        <!-- Glitter Particles (generated by JS) -->
        <div class="glitter-container" id="glitterContainer"></div>
    </div>

    <!-- ============================================
         HERO/BANNER SECTION
    ============================================ -->
    <header class="hero-section">
        <div class="banner-placeholder">
            <div class="banner-content">
                <img src="logo.png" alt="Clawed up Glam Logo" class="banner-logo">
                <h1 class="banner-text">Clawed up Glam</h1>
                <p class="banner-subtext">Where Beauty Meets Perfection</p>
            </div>
            <div class="hero-glitter" id="heroGlitter"></div>
        </div>
    </header>

    <!-- ============================================
         MAIN CONTENT - APPOINTMENT FORM
    ============================================ -->
    <main class="main-content">
        <div class="form-container">
            <!-- Form Header -->
            <div class="form-header">
                <i class="fas fa-calendar-check header-icon"></i>
                <h2>Book Your Appointment</h2>
                <p>Schedule your perfect nail experience today!</p>
            </div>

            <!-- Appointment Booking Form -->
            <form id="appointmentForm" class="appointment-form" novalidate>

                <div class="form-group">
                    <label for="fullName">
                        Full Name <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your full name"
                            required
                            minlength="2"
                            autocomplete="name"
                        >
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">
                        Email ID <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email address"
                            required
                            autocomplete="email"
                        >
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <!-- Phone Number Field -->
                <div class="form-group">
                    <label for="phone">
                        Phone Number <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="Enter your phone number"
                            required
                            pattern="[0-9]{10,15}"
                            title="Please enter a valid phone number (10-15 digits)"
                            autocomplete="tel"
                        >
                        <i class="fas fa-phone"></i>
                    </div>
                </div>

                <!-- Place/Location Field -->
                <div class="form-group">
                    <label for="place">
                        Place <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="place" 
                            name="place" 
                            placeholder="Enter your city/location"
                            required
                            minlength="2"
                            autocomplete="address-level2"
                        >
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                </div>

                <!-- Date and Time Row -->
                <div class="form-row">
                    <!-- Appointment Date Field -->
                    <div class="form-group">
                        <label for="appointmentDate">
                            Appointment Date <span class="required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="date" 
                                id="appointmentDate" 
                                name="appointmentDate" 
                                required
                            >
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                    </div>

                    <!-- Appointment Time Field -->
                    <div class="form-group">
                        <label for="appointmentTime">
                            Appointment Time <span class="required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="time" 
                                id="appointmentTime" 
                                name="appointmentTime" 
                                required
                                min="09:00"
                                max="20:00"
                            >
                            <i class="fas fa-clock"></i>
                        </div>
                    </div>
                </div>

                <!-- Service Type Field -->
                <div class="form-group">
                    <label for="serviceType">
                        Service Type
                    </label>
                    <div class="input-wrapper">
                        <select 
                            id="serviceType" 
                            name="serviceType"
                        >
                            <option value="">Select a service (optional)</option>
                            
                            <optgroup label="ON NATURAL">
                                <option value="Dry Russian Manicure - ₹399">Dry Russian Manicure - ₹399</option>
                                <option value="Dry Russian Mani + Gel Polish - ₹599">Dry Russian Mani + Gel Polish - ₹599</option>
                                <option value="Builder Gel Overlay (Short) - ₹999">Builder Gel Overlay (Short) - ₹999</option>
                                <option value="Builder Gel Overlay (Medium) - ₹1,099">Builder Gel Overlay (Medium) - ₹1,099</option>
                                <option value="Builder Gel Overlay (Long) - ₹1,299">Builder Gel Overlay (Long) - ₹1,299</option>
                            </optgroup>
                            
                            <optgroup label="GEL X EXTENSION (PERMANENT)">
                                <option value="Gel-X Extension (Short) - ₹1,099">Gel-X Extension (Short) - ₹1,099</option>
                                <option value="Gel-X Extension (Medium) - ₹1,299">Gel-X Extension (Medium) - ₹1,299</option>
                                <option value="Gel-X Extension (Long) - ₹1,499">Gel-X Extension (Long) - ₹1,499</option>
                            </optgroup>
                            
                            <optgroup label="TIP + BUILDGEL (PERMANENT)">
                                <option value="Tip + Builder (Short) - ₹999">Tip + Builder (Short) - ₹999</option>
                                <option value="Tip + Builder (Medium) - ₹1,299">Tip + Builder (Medium) - ₹1,299</option>
                                <option value="Tip + Builder (Long) - ₹1,600">Tip + Builder (Long) - ₹1,600</option>
                            </optgroup>
                            
                            <optgroup label="ADD ONS">
                                <option value="Cat Eye (Full Set) - ₹399">Cat Eye (Full Set) - ₹399</option>
                                <option value="Cat Eye (Per Nail) - ₹70">Cat Eye (Per Nail) - ₹70</option>
                                <option value="Chrome (Full Set) - ₹350">Chrome (Full Set) - ₹350</option>
                                <option value="Chrome (Per Nail) - ₹70">Chrome (Per Nail) - ₹70</option>
                                <option value="Brush Art (Per Nail) - ₹50">Brush Art (Per Nail) - ₹50</option>
                                <option value="Shell Art (Per Nail) - ₹98">Shell Art (Per Nail) - ₹98</option>
                                <option value="Charm (Per Nail) - ₹79">Charm (Per Nail) - ₹79</option>
                                <option value="Colored French - ₹299">Colored French - ₹299</option>
                                <option value="Chrome French - ₹350">Chrome French - ₹350</option>
                                <option value="Rose Glow Spa Manicure - ₹499">Rose Glow Spa Manicure - ₹499</option>
                            </optgroup>
                            
                            <option value="Other">Other (Specify in notes)</option>
                        </select>
                        <i class="fas fa-spa"></i>
                    </div>
                </div>

                <!-- Additional Notes Field -->
                <div class="form-group">
                    <label for="additionalNotes">
                        Additional Notes
                    </label>
                    <div class="input-wrapper textarea-wrapper">
                        <textarea 
                            id="additionalNotes" 
                            name="additionalNotes" 
                            placeholder="Any special requests or notes (optional)"
                            rows="3"
                            maxlength="500"
                        ></textarea>
                        <i class="fas fa-comment-alt"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    <span>Book Appointment</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </main>


    <footer class="footer">
        <p>Made with <i class="fas fa-heart"></i> for Clawed up Glam <span style="font-size:1.2rem;color:#d72660;">💅</span></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
