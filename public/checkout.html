<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Checkout your press-on sets with delivery details." />
    <title>Checkout | Clawedup by Glam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="shop.css" />
</head>
<body>
    <header class="store-header">
        <a href="cart.html" class="brand-link" aria-label="Back to cart">
            <img src="logo.jpeg" alt="Clawedup by Glam logo" />
            <div class="brand-copy">
                <strong>Clawedup by Glam</strong>
                <span>Checkout</span>
            </div>
        </a>

        <div class="header-actions">
            <a class="link-chip" href="shop.html">Shop More Sets</a>
            <a class="cart-link" href="cart.html" aria-label="View cart">
                <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                <span>Cart</span>
                <span class="cart-badge" id="headerCartCount">0</span>
            </a>
        </div>
    </header>

    <main class="page-wrap">
        <section class="page-intro" aria-labelledby="checkoutHeading">
            <p>Final step</p>
            <h1 id="checkoutHeading">Checkout</h1>
            <p class="subtle">Enter your details to place your press-on set order.</p>
        </section>

        <section class="checkout-layout">
            <article class="panel">
                <div class="panel-body">
                    <form id="checkoutForm" class="form-grid" novalidate>
                        <div class="form-group">
                            <label for="customerName">Name *</label>
                            <input id="customerName" name="customerName" type="text" required minlength="2" autocomplete="name" />
                        </div>

                        <div class="form-group">
                            <label for="customerPhone">Phone Number *</label>
                            <input id="customerPhone" name="customerPhone" type="tel" required pattern="[0-9]{10,15}" autocomplete="tel" />
                        </div>

                        <div class="form-group">
                            <label for="customerAddress">Address *</label>
                            <textarea id="customerAddress" name="customerAddress" required minlength="8" autocomplete="street-address"></textarea>
                        </div>

                        <p class="validation-msg" id="checkoutError"></p>

                        <button type="submit" class="checkout-btn" id="placeOrderButton">Buy Now</button>
                    </form>

                    <div id="checkoutSuccess" class="success-box" hidden></div>
                </div>
            </article>

            <aside class="panel summary-card" aria-label="Order summary">
                <div class="panel-body">
                    <h2 style="font-family: 'Playfair Display', serif; font-size: 1.2rem;">Order Summary</h2>
                    <div id="orderSummaryList" class="order-list"></div>
                    <div class="summary-row total"><span>Total</span><strong id="orderTotal">INR 0.00</strong></div>
                </div>
            </aside>
        </section>
    </main>

    <script src="cart-store.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
